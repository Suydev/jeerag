<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEE Notes RAG — Ambarish Sir</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--border:#2a2f3a;--fg:#e6e8ee;--dim:#9aa3b2;--acc:#5eead4;--chip:#22303a;--danger:#ef4444;--ok:#22c55e}
* { box-sizing:border-box }
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);z-index:20}
header b{font-size:16px}
header .sub{color:var(--dim);font-size:12px;flex:1}
header button{background:var(--chip);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
header .right{display:flex;gap:6px}

/* ---------- Thread (assistant-ui pattern) ---------- */
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto;position:relative}
#log::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);z-index:0;opacity:.3}
#log .msg{position:relative;z-index:1;padding:12px 14px;border-radius:12px;white-space:normal;overflow-wrap:break-word;max-width:85%}
#log .msg.user{background:#1c2733;align-self:flex-end;color:var(--fg)}
#log .msg.assistant{background:var(--panel);border:1px solid var(--border);align-self:flex-start;color:var(--fg)}
#log .msg.assistant table{border-collapse:collapse;margin:8px 0}
#log .msg.assistant th,.msg.assistant td{border:1px solid var(--border);padding:4px 10px}
#log .msg.assistant img{max-width:100%;border-radius:8px;margin:6px 0;background:#fff}
#log .msg.assistant pre{background:#0b0d11;padding:10px;border-radius:8px;overflow-x:auto}
#log .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#log .src{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--acc)}
#log .ctx{margin-top:8px;font-size:12px;color:var(--dim)}
#log .ctx details{margin:4px 0}
#log .ctx summary{cursor:pointer;color:var(--fg)}

/* streaming deltas get a slight fade-in */
#log .msg.assistant .delta{opacity:.92}

/* ---------- Footer / Composer ---------- */
footer{padding:12px 14px;border-top:1px solid var(--border);background:var(--panel);z-index:20}
.inrow{display:flex;gap:8px;max-width:900px;margin:0 auto;width:100%}
textarea{flex:1;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;height:52px}
button.send{background:var(--acc);color:#082b26;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
button.send.stop{background:var(--danger);color:#fff}
button.send:disabled{opacity:0.6;cursor:not-allowed}

/* ---------- Panels (settings, deck, pageview) ---------- */
#settings,#deck,#pageview{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:30}
#settings .box,#deck .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(520px,94vw);max-height:90vh;overflow:auto}
#settings label,#deck label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
#settings input,#deck input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px;font:inherit}
#settings .row,#deck .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.small{font-size:12px;color:var(--dim)}
.pill{font-size:11px;background:var(--chip);padding:2px 8px;border-radius:99px;color:var(--dim)}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:var(--bg)}
.card .q{font-weight:600;margin-bottom:6px}
.card .a{border-left:3px solid var(--acc);padding-left:10px;color:var(--fg);white-space:pre-wrap}
.card .g{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .g button{background:var(--chip);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}
.card img{max-width:200px;border-radius:6px;margin-top:8px;background:#fff}

/* ---------- Right sidebar citations ---------- */
#right{position:fixed;right:-420px;top:0;bottom:0;width:420px;border-left:1px solid var(--border);background:var(--panel);z-index:25;transition:right .25s;overflow:auto}
#right.open{right:0}
#right .box{padding:16px}
#right h2{font-size:14px;margin:0 0 12px;color:var(--dim)}
#right .src{display:flex;align-items:flex-start;gap:8px;margin:8px 0;padding:8px;background:var(--bg);border-radius:8px;font-size:12px}
#right .src .chip{font-weight:600;color:var(--acc)}
#right .src .text{color:var(--dim);font-size:11.5px}
#right .src img{max-width:100%;border-radius:4px;margin-top:6px}
#right .close{position:absolute;top:10px;right:12px;background:var(--chip);border:none;border-radius:8px;padding:4px 10px;color:var(--fg);cursor:pointer}
body.sidebar-open #log{filter:blur(1px);pointer-events:none}

@media (max-width:768px){
  #right{width:100%}
  body.sidebar-open #log{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>
<header>
  <b>JEE Notes RAG</b>
  <span class="pill" id="statpill">…</span>
  <span class="sub">Ambarish Sir notes · LaTeX rendered · <a href="https://www.youtube.com/@ambarishphysics" target="_blank" style="color:var(--dim)">credit</a></span>
  <span class="right">
    <button onclick="openDeck()">🃏 Deck <span class="pill" id="duen">0</span></button>
    <button onclick="openSettings()">⚙ Settings</button>
    <button id="citeBtn" onclick="toggleCitations()" style="background:var(--chip);color:var(--fg);border:none;border-radius:8px;padding:6px 10px;cursor:pointer">📚 Citations</button>
  </span>
</header>

<main id="log"></main>

<!-- Right sidebar: citations for current answer -->
<div id="right">
  <button class="close" onclick="toggleCitations()">✕</button>
  <h2>Citations</h2>
  <div id="rightList"></div>
</div>

<footer>
  <div class="inrow">
    <textarea id="q" placeholder="Ask anything from your notes… e.g. cone of static friction"></textarea>
    <button class="send" id="sendBtn" onclick="ask()">Ask</button>
    <button class="send" style="background:var(--chip);color:var(--fg)" onclick="figures()">🖼</button>
  </div>
</footer>

<!-- Doubt Deck -->
<div id="deck"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b>🃏 Doubt Deck</b><span class="small" id="deckstats"></span>
    <button onclick="closeDeck()">Close</button>
  </div>
  <div class="small" style="margin-top:6px">Cards you saved from answers, scheduled by SM-2. Grade what you recall: 0-2 forgot, 3 hard, 4 good, 5 easy.</div>
  <div id="decklist"></div>
</div></div>

<!-- Page viewer -->
<div id="pageview" onclick="this.style.display='none'"><img id="pageimg" alt="note page"></div>

<script>
const log = document.getElementById('log');
let history = [], lastCtx = null;
marked && (marked.setOptions({breaks:true}));

// ---------- Chat state machine (research: OpenTranscribe RAG Chat plan) ---
// idle → submitting → retrieving → thinking → streaming → done
let chatState = 'idle';
let activeController = null;
let activeBox = null;

function setState(s) {
  chatState = s;
  const btn = document.getElementById('sendBtn');
  const q = document.getElementById('q');
  if (s === 'idle') {
    btn.textContent = 'Ask';
    btn.classList.remove('stop');
    q.disabled = false;
  } else {
    btn.textContent = '⏹ Stop';
    btn.classList.add('stop');
    q.disabled = (s !== 'idle');
  }
}

function el(cls, html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function math(d){renderMathInElement(d,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false})}

function stopGeneration() {
  if (activeController) {
    activeController.abort();
    setState('idle');
    if (activeBox) {
      const note = document.createElement('div');
      note.className = 'small';
      note.textContent = '⏹ Stopped by user.';
      activeBox.appendChild(note);
    }
    activeController = null; activeBox = null;
  }
}

async function ask(){
  if (chatState !== 'idle') { stopGeneration(); return; }
  const q=document.getElementById('q');const text=q.value.trim();if(!text)return;
  q.value='';
  setState('submitting');

  // optimistic user message
  el('msg user',text.replace(/</g,'&lt;'));
  const box=el('msg assistant','<span class="small">retrieving notes…</span>');
  activeBox = box;

  activeController = new AbortController();
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:text,history}),
    signal: activeController.signal,
  });
  setState('retrieving');
  const reader=res.body.getReader();const dec=new TextDecoder();let buf='',answer='',ctxHtml='';
  const pump=()=>{
    box.innerHTML=(answer?marked.parse(answer):'<span class="small">no LLM answer — see retrieved passages below</span>')+ctxHtml;
    math(box);log.scrollTop=log.scrollHeight;
  };
  try {
    while(true){
      const{value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const ev=buf.slice(0,i);buf=buf.slice(i+2);
        const m=ev.match(/^event: (\w+)\ndata: (.*)$/s);if(!m)continue;
        const d=JSON.parse(m[2]);
        if(m[1]==='context'){
          setState('thinking');
          lastCtx=d;
          renderCitations(d.diagrams||[]);
          ctxHtml='<div class="ctx"><details><summary>📄 '+d.passages.length+' passages from your notes</summary>'+
            d.passages.map(p=>'<div class="srcs"><span class="src">'+p.file+' · p.'+p.page+' · '+p.topic+'</span></div><div>'+p.text.slice(0,400).replace(/</g,'&lt;')+'…</div>').join('')+
            '</details>'+(d.diagrams.length?'<div>'+d.diagrams.map(g=>'<img src="'+g.url+'" alt="diagram p.'+g.page+' ('+g.file+')"><div class="small">diagram · '+g.file+' p.'+g.page+'</div>').join('')+'</div>':'')+'</div>';
          if(!answer)pump();
        }else if(m[1]==='delta'){setState('streaming');answer+=d.t;pump();}
        else if(m[1]==='no_llm'||m[1]==='error'){answer=answer||'';ctxHtml+='<div class="small">'+(d.message||'')+'</div>';pump();}
        else if(m[1]==='done'){
          setState('done');
          pump();history.push({role:'user',content:text});history.push({role:'assistant',content:answer});
          if(answer&&lastCtx){
            const g=lastCtx.diagrams&&lastCtx.diagrams[0];
            const act=document.createElement('div');act.className='act';
            act.innerHTML='<button>🃏 Save to Deck</button>'+(g?'<button>📄 Open p.'+g.page+'</button>':'');
            act.children[0].onclick=()=>saveCard(text,answer,g?g.file:null,g?g.page:null,g?g.path:null,g?g.topic:null);
            if(g)act.children[1].onclick=()=>showPage(g.file,g.page);
            box.appendChild(act);
          }
          setState('idle');
          activeController = null; activeBox = null;
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      // stopped by user — partial content preserved
    } else {
      box.innerHTML += '<div class="small">Error: ' + (e.message||e) + '</div>';
      setState('idle');
    }
  }
}
setState('idle');
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
document.getElementById('sendBtn').addEventListener('click',ask);

// ---------- Citations sidebar (right panel) ----------
function renderCitations(diagrams){
  const list=document.getElementById('rightList');
  list.innerHTML = diagrams.map(d=>
    '<div class="src">'+
      '<div class="chip">'+(g.file)+' · p.'+g.page+'</div>'+
      '<div class="text">'+(g.caption||'').slice(0,200)+'</div>'+
      (g.path?'<img src="'+g.url+'" alt="figure">':'')+
    '</div>'
  ).join('');
}
function toggleCitations(){
  const r=document.getElementById('right');
  r.classList.toggle('open');
  document.body.classList.toggle('sidebar-open');
}
function showPage(file,page){pageimg.src='/pdfpage/'+encodeURIComponent(file)+'/'+page+'.png';document.getElementById('pageview').style.display='flex'}
function saveCard(q,a,file,page,diagram,topic){
  fetch('/api/cards',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:q,answer:a,file,page,diagram,topic})})
    .then(r=>r.json()).then(()=>{refreshDeckCount();alert('Saved to Doubt Deck — review it tomorrow.')});
}

// ---------- Figures (diagram search) ----------
async function figures(){
  const q=document.getElementById('q');const text=q.value.trim();if(!text)return;
  q.value='';el('msg user','🖼 '+text.replace(/</g,'&lt;'));
  const box=el('msg assistant','<span class="small">searching figures…</span>');
  const d=await(await fetch('/api/diagrams?q='+encodeURIComponent(text))).json();
  box.innerHTML=d.diagrams.length?('<div class="small">'+d.diagrams.length+' figures</div><div class="gal">'+
    d.diagrams.map(g=>'<figure><img src="'+g.url+'" onclick="showPage(\''+g.file.replace(/'/g,"\\'")+'\','+g.page+')" alt="figure"><figcaption>'+g.file+' · p.'+g.page+'<br>'+(g.caption||'').slice(0,90)+'</figcaption></figure>').join('')+'</div>')
    :'<span class="small">no figures matched — run python -m jeerag.caption first</span>';
}

// ---------- Doubt Deck ----------
async function openDeck(){
  document.getElementById('deck').style.display='flex';
  const d=await(await fetch('/api/cards')).json();
  document.getElementById('deckstats').textContent=d.stats.total+' cards · '+d.stats.due_today+' due · '+d.stats.mature+' mature';
  const list=document.getElementById('decklist');
  if(!d.due.length){list.innerHTML='<div class="small" style="margin-top:12px">Nothing due. Save answers with "🃏 Save" under any reply.</div>';return}
  list.innerHTML=d.due.map(c=>'<div class="card"><div class="q">'+(c.question||'').replace(/</g,'&lt;')+'</div>'+
    '<div class="a">'+marked.parse(c.answer||'')+'</div>'+
    (c.diagram?'<img src="/'+c.diagram+'" onclick="showPage(\''+c.file.replace(/'/g,"\\'")+'\','+c.page+')">':'')+
    '<div class="small">'+(c.file?c.file+' · p.'+c.page:'')+(c.topic?' · '+c.topic:'')+'</div>'+
    '<div class="g">'+[0,2,3,4,5].map(sc=>'<button onclick="grade('+c.id+','+sc+')">'+(sc<3?'forgot':sc===3?'hard':sc===4?'good':'easy')+'</button>').join('')+'</div></div>').join('');
  math(list);
}
function closeDeck(){document.getElementById('deck').style.display='none'}
async function grade(id,score){
  await fetch('/api/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'grade',id,score})});
  openDeck();
}
async function refreshDeckCount(){try{const d=await(await fetch('/api/cards')).json();document.getElementById('duen').textContent=d.stats.due_today}catch(e){}}
async function openSettings(){close0();const c=await(await fetch('/api/config')).json();
  s_base.value=c.llm_base_url||'';s_model.value=c.llm_model||'';s_key.value=c.llm_api_key_set?'(saved ••••••)':'';
  document.getElementById('settings').style.display='flex'}
function close0(){document.getElementById('settings').style.display='none'}
const closeSettings=close0;
async function saveSettings(){
  const body={llm_base_url:s_base.value.trim(),llm_model:s_model.value.trim()};
  if(s_key.value&&!s_key.value.startsWith('(saved'))body.llm_api_key=s_key.value.trim();
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  close0()}
(async()=>{try{const s=await(await fetch('/api/stats')).json();
  statpill.textContent=s.files+' PDFs · '+s.pages+' pages · '+s.diagrams+' diagrams'}catch(e){statpill.textContent='offline'}
  refreshDeckCount()})();
</script>
</body>
</html>
